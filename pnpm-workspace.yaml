packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@hono/zod-validator": ^0.9.1
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^24
  better-sqlite3: ^13.0.3
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: false
